# neonjo.com — the studio's own website, served from this PC through the
# neon-portal tunnel (deploy/cloudflared/config.yml).
#
# Until 2026-11-10 the root domain belonged to NEXORA, which now has its own
# domain (nexorajo.space). Anything still reaching NEXORA's old paths here —
# bookmarks, old links, the app — is sent on to the same path there, so nobody
# lands on a dead page.
#
# For now site/ holds a holding page. When the new website is ready, it replaces
# what is in site/ (or this container), and nothing else has to change.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Cloudflare: never let nginx build an absolute redirect with its own
    # port or http://.
    absolute_redirect off;

    # www → the bare domain.
    if ($host = www.neonjo.com) {
        return 301 https://neonjo.com$request_uri;
    }

    # NEXORA's old home, now on its own domain.
    location ^~ /platform {
        return 301 https://nexorajo.space$request_uri;
    }

    location = /health { access_log off; return 200 "ok\n"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
