<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON — Apps &amp; Interior Design</title>
  <meta name="description" content="NEON — apps and interior design studio. New website coming soon.">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --bg: #f6f2ec; --ink: #15131f; --muted: #6b6676; --line: rgba(21,19,31,.12); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main { text-align: center; max-width: 520px; width: 100%; }
    .logo { width: min(260px, 70vw); height: auto; mix-blend-mode: multiply; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; margin: 28px 0 6px; }
    p { color: var(--muted); margin: 4px 0; line-height: 1.6; }
    .ar { direction: rtl; }
    a.btn {
      display: inline-block; margin-top: 28px; padding: 10px 20px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: .9rem;
    }
    a.btn:hover { background: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/neon-logo.png" alt="NEON — Apps &amp; Interior Design" width="480" height="417">
    <h1>New website coming soon</h1>
    <p class="ar">الموقع الجديد قريباً</p>
    <a class="btn" href="https://clients.neonjo.com">Client portal · بوابة العملاء</a>
  </main>
</body>
</html>
