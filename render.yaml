services:
  - type: web
    name: neon-client-portal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Company timezone for the daily notification jobs and task days.
      - key: APP_TIMEZONE
        value: Asia/Amman
      # Web Push (VAPID). Generate a pair once with:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # and use the same pair everywhere. Without them the portal still works;
      # notifications simply stay in-app.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Shared secret the scheduled notifier authenticates with. Must match the
      # CRON_SECRET GitHub Actions secret.
      - key: CRON_SECRET
        generateValue: true
      # Claude — the manager's chat assistant and receipt reading. Without it
      # both degrade gracefully and everything else is unaffected.
      - key: ANTHROPIC_API_KEY
        sync: false
      # WhatsApp, from the nexora-whatsapp library. Either transport works;
      # the official Cloud API is preferred when both are set because it is
      # the one that cannot get the number banned.
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_CLOUD_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_CLOUD_APP_SECRET
        sync: false
      # Or the whatsapp-web.js session the Nixora worker already holds; this
      # deployment only needs to reach it.
      - key: WHATSAPP_WORKER_URL
        sync: false
      - key: WHATSAPP_WORKER_KEY
        sync: false
      - key: WHATSAPP_LINE_ID
        value: main
      # Used to build the client link inside outgoing WhatsApp messages.
      - key: PUBLIC_APP_URL
        sync: false
