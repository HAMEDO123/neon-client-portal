name: NeonAdmin
options:
  bundleIdPrefix: com.neonjo
  deploymentTarget:
    iOS: "16.0"
targets:
  NeonAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Plain PNG icons + CFBundleIcons instead of an asset catalog: actool
      # in newer Xcodes refuses to compile xcassets when no simulator runtime
      # matches the SDK, and PNG resources need no compiler at all.
      - path: Resources/Icons
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "NEON"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NeonAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.neonjo.staff
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Signed for real now — TestFlight first, an Apple Business Manager
        # Custom App later. `ios-build.yml` still passes CODE_SIGNING_ALLOWED=NO
        # on the command line, which overrides these, so CI keeps producing the
        # same unsigned IPA it always did.
        DEVELOPMENT_TEAM: 745F9U99BC
        CODE_SIGN_STYLE: Automatic
