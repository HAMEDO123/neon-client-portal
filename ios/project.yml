name: NeonAdmin
options:
  bundleIdPrefix: com.neonjo
  deploymentTarget:
    iOS: "16.0"
targets:
  NeonAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The asset catalog, not the loose PNGs this used to carry. App Store
      # Connect refuses a build without one — 90022 "no 120x120 icon" and
      # 90713 "no CFBundleIconName" — however well the Home Screen renders.
      # The note that used to be here said actool refused to compile xcassets
      # when no simulator runtime matched the SDK; iOS 26.5 is installed now
      # and it compiles, and for an upload there is no alternative anyway.
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "NEON"
        # Written out rather than left to Xcode. Setting
        # ASSETCATALOG_COMPILER_APPICON_NAME normally makes Xcode inject this
        # during packaging, but not when the Info.plist is generated from this
        # file — and App Store Connect rejects the upload without it (90713),
        # after the build has already succeeded and been signed.
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NeonAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.neonjo.staff
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signed for real now — TestFlight first, an Apple Business Manager
        # Custom App later. `ios-build.yml` still passes CODE_SIGNING_ALLOWED=NO
        # on the command line, which overrides these, so CI keeps producing the
        # same unsigned IPA it always did.
        DEVELOPMENT_TEAM: 745F9U99BC
        CODE_SIGN_STYLE: Automatic
