name: NeonAdmin
options:
  bundleIdPrefix: com.neon
  deploymentTarget:
    iOS: "16.0"
targets:
  NeonAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Plain PNG icons + CFBundleIcons instead of an asset catalog: actool
      # in newer Xcodes refuses to compile xcassets when no simulator runtime
      # matches the SDK, and PNG resources need no compiler at all.
      - path: Resources/Icons
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "NEON Admin"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NeonAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.neon.admin
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Left unsigned on purpose — this build is meant to be re-signed by
        # AltStore/AltServer on the sideloader's own machine using their own
        # free Apple ID, not signed here.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
