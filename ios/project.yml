name: NeonAdmin
options:
  bundleIdPrefix: com.neon
  deploymentTarget:
    iOS: "16.0"
packages:
  # Google's WebRTC, prebuilt as an xcframework by stasel/WebRTC (the calls
  # area's only dependency; nothing else in the app needs it).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  NeonAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Plain PNG icons + CFBundleIcons instead of an asset catalog: actool
      # in newer Xcodes refuses to compile xcassets when no simulator runtime
      # matches the SDK, and PNG resources need no compiler at all.
      - path: Resources/Icons
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
    dependencies:
      - package: WebRTC
    info:
      path: Info.plist
      properties:
        # One app for the whole studio now — the manager and the team sign in
        # to the same build and the server's `side` decides what they see.
        CFBundleDisplayName: "NEON"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UILaunchScreen: {}
        # Proof of finished work is usually a photo taken on site, there and
        # then. The picker for existing photos needs no permission at all.
        NSCameraUsageDescription: "NEON uses the camera to photograph finished work, and for video calls with the studio."
        NSMicrophoneUsageDescription: "NEON uses the microphone for calls with the studio."
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NeonAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.neon.admin
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Left unsigned on purpose — this build is meant to be re-signed by
        # AltStore/AltServer on the sideloader's own machine using their own
        # free Apple ID, not signed here.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        # Except on the simulator, which is signed locally ("Sign to Run
        # Locally", no Apple ID involved). A simulator app with no signature at
        # all has no application identifier, so the Keychain refuses it and
        # the session token is gone on every relaunch.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
