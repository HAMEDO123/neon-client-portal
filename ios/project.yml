name: NeonAdmin
options:
  bundleIdPrefix: com.neon
  deploymentTarget:
    iOS: "16.0"
# The version numbers, for the app and its share extension alike: App Store
# Connect refuses an upload whose extension says a different version from the
# app's. A command-line CURRENT_PROJECT_VERSION=<n> overrides both.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Google's WebRTC, prebuilt as an xcframework by stasel/WebRTC (the calls
  # area's only dependency; nothing else in the app needs it).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  NeonAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # Each area keeps its feature inventory (FEATURES.md) and the kit its
        # guide beside the code; none of it belongs in the app bundle.
        excludes:
          - "**/*.md"
      # The icon as an asset catalog: App Store Connect refuses an upload
      # without one (90022 "no 120x120 icon", 90713 "no CFBundleIconName").
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
    dependencies:
      - package: WebRTC
      # The share extension ("NEON" in the share sheet), in PlugIns.
      - target: NeonShare
    # Push notifications (APNs). Xcode's automatic signing turns the
    # capability on for the App ID; an App Store export makes it "production".
    # The keychain group is the one the share extension also has: the session
    # token lives there (Core/TokenStore.swift), so the extension sends as
    # whoever is signed in here and signing out here signs it out too. A
    # team-prefixed group needs nothing registered on the developer portal.
    entitlements:
      path: NeonAdmin.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.neonjo.staff.shared
    info:
      path: Info.plist
      properties:
        # One app for the whole studio now — the manager and the team sign in
        # to the same build and the server's `side` decides what they see.
        CFBundleDisplayName: "NEON"
        # From the build settings, so an upload can carry its own build number
        # (xcodebuild … CURRENT_PROJECT_VERSION=<n>) — TestFlight refuses one
        # it has seen before.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        # The keychain group above, spelled out for TokenStore to name. From
        # the team rather than $(AppIdentifierPrefix), which only a signed
        # build fills in; this team's App ID prefix is its team ID.
        NeonKeychainGroup: "$(DEVELOPMENT_TEAM).com.neonjo.staff.shared"
        # Written out: generated Info.plists do not get it injected, and App
        # Store Connect rejects the upload without it (90713).
        CFBundleIconName: AppIcon
        # HTTPS and WebRTC's standard DTLS-SRTP only — exempt, so TestFlight
        # does not stop every build to ask.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Proof of finished work is usually a photo taken on site, there and
        # then. The picker for existing photos needs no permission at all.
        NSCameraUsageDescription: "NEON uses the camera to photograph finished work, and for video calls with the studio."
        # The chat's camera shows the newest photos above the shutter, as
        # WhatsApp does — asked for only when the camera opens, and the strip
        # is simply not drawn without it (the gallery button's system picker
        # needs no permission). Its editor's Save button adds to the library.
        NSPhotoLibraryUsageDescription: "NEON shows your latest photos and videos under the chat camera, so you can send one in a tap."
        NSPhotoLibraryAddUsageDescription: "NEON saves the photos and videos you choose to save from a chat to your library."
        # A call keeps its sound when somebody switches to another app, as a
        # phone call does (audio), and rings a closed or locked phone through
        # a VoIP push and CallKit (voip); nothing else runs in the background.
        # PushKit and CallKit are system frameworks, linked by their imports.
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: "NEON uses the microphone for calls with the studio."
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NeonAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.neonjo.staff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Signed with the studio's paid team for TestFlight (and later an Apple
        # Business Manager Custom App). ios-build.yml passes
        # CODE_SIGNING_ALLOWED=NO on the command line for its device build,
        # which overrides this, so CI still produces the unsigned IPA.
        DEVELOPMENT_TEAM: 745F9U99BC
        CODE_SIGN_STYLE: Automatic
        # The simulator is always signed locally ("Sign to Run Locally", no
        # Apple ID involved), however the device build is signed. A simulator
        # app with no signature at all has no application identifier, so the
        # Keychain refuses it and the session token is gone on every relaunch.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  # "NEON" in the share sheet: WhatsApp, Photos, Files, Safari… → pick one or
  # more chats → it arrives there as an attachment (or a text message).
  # Share/README.md has the whole story.
  NeonShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes:
          - "**/*.md"
      # The kit's colours, surfaces and motion, and the server's dates and
      # media addresses — compiled in as they are, so the extension looks
      # like the app. They only need AppLanguage and L, which the extension
      # defines for itself (Share/ShareLanguage.swift).
      - path: Sources/UI/Tokens.swift
      - path: Sources/UI/DesignSystem.swift
      - path: Sources/Core/Formatting.swift
      # The same keychain item as the app.
      - path: Sources/Core/TokenStore.swift
      # The studio's round mark, for the team chat's face.
      - path: Resources/Icons
        buildPhase: resources
    entitlements:
      path: NeonShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.neonjo.staff.shared
    info:
      path: NeonShare-Info.plist
      properties:
        CFBundleDisplayName: "NEON"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        NeonKeychainGroup: "$(DEVELOPMENT_TEAM).com.neonjo.staff.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            # What makes NEON appear in the share sheet. Each is a ceiling per
            # kind; the extension sends at most ten things in all.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: NeonShare
        PRODUCT_BUNDLE_IDENTIFIER: com.neonjo.staff.share
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        # Signed as the app is (see NeonAdmin above).
        DEVELOPMENT_TEAM: 745F9U99BC
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
