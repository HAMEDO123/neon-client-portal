# NEON on the studio's own PC: the site, its PostgreSQL, and the tunnel that puts
# it on clients.neonjo.com.
#
#   docker compose --env-file .env.docker up -d --build            site + database
#   docker compose --env-file .env.docker --profile public up -d   ...and go public
#   docker compose --env-file .env.docker --profile public --profile live up -d
#                                     ...and the scheduler, once this PC is the real site
#
# `--env-file .env.docker` is required: it holds the secrets and the database
# password. Forget it and Compose refuses to start rather than starting wrong.
#
# The WhatsApp worker keeps its own project in whatsapp-worker/ — it holds a
# linked WhatsApp session that must not be disturbed — and the site reaches it
# through the host.

name: neon

services:
  db:
    image: postgres:17
    container_name: neon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neon
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run compose with --env-file .env.docker}
    volumes:
      # The studio's data. Named, so `docker compose down` leaves it alone;
      # `down -v` deletes it.
      - db-data:/var/lib/postgresql/data
    ports:
      # This PC only — for loading a copy and taking backups, never the network.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -d neon"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        # Stable across builds, from .env.docker, so a page rendered by an
        # earlier build can still have its server actions decrypted — see the
        # Dockerfile. Absent, Next makes a new key each build and every page
        # anybody has open breaks the moment this is rebuilt.
        NEON_ACTIONS_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    container_name: neon-app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://neon:${POSTGRES_PASSWORD:?run compose with --env-file .env.docker}@db:5432/neon
      WHATSAPP_WORKER_URL: http://host.docker.internal:4100
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The daily database backups (scripts/backup-docker-db.ps1 writes them
      # here on the PC), so the manager's status screen can say when the last
      # one ran and what backup.log said. Read-only: the site can look at
      # them and can never change or delete one.
      - ./local-backup/docker:/backups:ro
    ports:
      # This PC only, for testing. The public way in is the tunnel.
      - "127.0.0.1:3011:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/employee/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: neon-tunnel
    restart: unless-stopped
    # Only with --profile public, so nothing is put on the internet by accident.
    profiles: ["public"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel's secret stays where cloudflared wrote it, outside the repo.
      - ${USERPROFILE:?USERPROFILE is not set}/.cloudflared/966aca87-3a46-4400-829c-d7a2667f1f04.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      app:
        condition: service_healthy

  neon-cameras:
    # The CCTV relay: the studio's Tapo cameras for the manager's phone
    # (deploy/go2rtc/README.md). The site tells it about each camera added in
    # the app at run time and proxies its snapshots and live MJPEG to the phone
    # (CAMERAS_RELAY_URL, default http://neon-cameras:1984). It bundles ffmpeg.
    image: alexxit/go2rtc:1.9.14
    container_name: neon-cameras
    restart: unless-stopped
    # go2rtc.yaml first: it is the file go2rtc writes to (git-ignored; optional
    # hand-written cameras). neon.yaml is NEON's committed settings.
    command: ["go2rtc", "-config", "/config/go2rtc.yaml", "-config", "/config/neon.yaml"]
    volumes:
      - ./deploy/go2rtc:/config
    ports:
      # This PC only, for go2rtc's own page. Never published further: the
      # phone reaches the cameras through the site, as the manager.
      - "127.0.0.1:1984:1984"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: curlimages/curl:8.22.0
    container_name: neon-scheduler
    restart: unless-stopped
    # Only once this PC is the real site (--profile live). Started before the
    # switch-over, it would send the team notifications from a copy they are not
    # working on.
    profiles: ["live"]
    environment:
      # The one secret it needs, not the whole of .env.docker.
      CRON_SECRET: ${CRON_SECRET:?run compose with --env-file .env.docker}
    # The notification jobs every ten minutes, replacing the GitHub schedule that
    # never ran: deadline reminders and the day's follow-up questions on every
    # run, the 08:00 and 16:00 summaries when a run lands inside their hour. Every
    # job is idempotent, so a late or doubled run is harmless. One log line per
    # run: docker logs neon-scheduler
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do status=$$(curl -sS -o /tmp/ran.json -w "%{http_code}" --max-time 120 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/notifications); echo "$$(date -u +%FT%TZ) HTTP $$status $$(head -c 400 /tmp/ran.json)"; sleep 600; done'
    depends_on:
      app:
        condition: service_healthy

  meeting-scheduler:
    image: curlimages/curl:8.22.0
    container_name: neon-meeting-scheduler
    restart: unless-stopped
    # Behind --profile live with the other one, for the same reason.
    profiles: ["live"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?run compose with --env-file .env.docker}
    # Meetings only, every minute. A meeting reminder is worth little late: on
    # the ten-minute pass a meeting at 2:30 could be announced at 2:38. The full
    # pass is deliberately left alone rather than sped up — it carries the rules
    # engine and the deadline sweep, which are the expensive jobs, and running
    # those sixty times an hour would buy nothing.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # One line per run, like the other scheduler: a service that says nothing
      # cannot be trusted, and `docker logs neon-meeting-scheduler` is the only
      # window onto whether reminders are actually going out.
      # The clock reminders ride the same minute: "Clock in" every two minutes
      # is worth little on a ten-minute pass (lib/clock-reminders.ts). So does
      # the team map's keeper, so a position never outlives the working day by
      # more than a minute (lib/staff-location.ts).
      # And the look at the studio's WhatsApp (lib/whatsapp-watch.ts): a client
      # writing in is told to the team within the minute, not within ten.
      - 'while true; do for job in meetings clock location whatsapp; do status=$$(curl -sS -o /tmp/ran.json -w "%{http_code}" --max-time 50 -H "Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/notifications?job=$$job" || echo 000); echo "$$(date -u +%FT%TZ) $$job HTTP $$status $$(head -c 200 /tmp/ran.json)"; done; sleep 60; done'
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
