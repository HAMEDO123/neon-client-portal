name: Build iOS app (unsigned)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild \
            -project NeonAdmin.xcodeproj \
            -scheme NeonAdmin \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify build output
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/NeonAdmin.app"
          BIN="$APP/NeonAdmin"
          test -d "$APP" || { echo "::error::App bundle not found at $APP"; exit 1; }
          test -f "$BIN" || { echo "::error::Executable not found at $BIN"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::Info.plist missing from app bundle"; exit 1; }
          echo "App bundle contents:"
          find "$APP" -maxdepth 2 -exec ls -la {} \;
          BIN_SIZE=$(stat -f%z "$BIN")
          echo "Executable size: $BIN_SIZE bytes"
          # A real compiled Swift/WKWebView binary is well into six figures even
          # unsigned and unstripped extras aside — anything tiny means the build
          # silently produced a stub instead of the actual app.
          test "$BIN_SIZE" -gt 50000 || { echo "::error::Executable suspiciously small ($BIN_SIZE bytes) — build likely broken"; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/NeonAdmin.app" Payload/
          zip -r "NeonAdmin-unsigned.ipa" Payload
          echo "Final .ipa size:"
          ls -la NeonAdmin-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonAdmin-unsigned-ipa
          path: ios/NeonAdmin-unsigned.ipa
