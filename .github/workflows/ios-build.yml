name: Build iOS app (unsigned)

on:
  push:
    paths:
      - "ios/**"
      - "!ios/screenshots/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned .app (device)
        working-directory: ios
        run: |
          xcodebuild \
            -project NeonAdmin.xcodeproj \
            -scheme NeonAdmin \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify build output
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/NeonAdmin.app"
          BIN="$APP/NeonAdmin"
          test -d "$APP" || { echo "::error::App bundle not found at $APP"; exit 1; }
          test -f "$BIN" || { echo "::error::Executable not found at $BIN"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::Info.plist missing from app bundle"; exit 1; }
          echo "App bundle contents:"
          find "$APP" -maxdepth 2 -exec ls -la {} \;
          BIN_SIZE=$(stat -f%z "$BIN")
          echo "Executable size: $BIN_SIZE bytes"
          # A real compiled Swift binary with networking + SwiftUI views is well
          # into six figures — anything tiny means the build produced a stub.
          test "$BIN_SIZE" -gt 50000 || { echo "::error::Executable suspiciously small ($BIN_SIZE bytes) — build likely broken"; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/NeonAdmin.app" Payload/
          zip -r "NeonAdmin-unsigned.ipa" Payload
          echo "Final .ipa size:"
          ls -la NeonAdmin-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonAdmin-unsigned-ipa
          path: ios/NeonAdmin-unsigned.ipa

      # --- Simulator build + real screenshot, so the UI is actually verified
      # instead of just "the compile succeeded". The screenshot gets committed
      # straight back into the repo since artifact downloads need a token that
      # isn't available outside this CI job.
      - name: Boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .udid' | head -1)
          echo "Using simulator: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project NeonAdmin.xcodeproj \
            -scheme NeonAdmin \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath buildsim \
            -destination "id=$DEVICE_ID" \
            build

      - name: Install, launch, and screenshot
        working-directory: ios
        run: |
          APP="buildsim/Build/Products/Debug-iphonesimulator/NeonAdmin.app"
          mkdir -p screenshots
          xcrun simctl install "$DEVICE_ID" "$APP"

          xcrun simctl launch "$DEVICE_ID" com.neon.admin
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/login-screen.png

          # -uiTestMode is a Debug-only flag (see APIClient.swift / Models.swift)
          # that injects fixture data instead of a real login, so the Dashboard
          # can be screenshotted without any production credentials in CI.
          xcrun simctl terminate "$DEVICE_ID" com.neon.admin || true
          xcrun simctl launch "$DEVICE_ID" com.neon.admin -uiTestMode
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/dashboard-preview.png

      - name: Commit screenshots
        working-directory: ios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/login-screen.png screenshots/dashboard-preview.png
          git diff --cached --quiet && echo "No screenshot changes" || git commit -m "ci: update simulator screenshots [skip ci]"
          git push
